name: Changelog

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" posts the latest update again (for testing)

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Post update to Discord
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: python3 .github/changelog.py "${{ github.event.before }}" "${{ github.sha }}"
