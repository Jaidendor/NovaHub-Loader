name: Daily key

on:
  schedule:
    - cron: "7 0 * * *" # every day just after midnight UTC
  workflow_dispatch: # "Run workflow" makes a new key right away

permissions:
  contents: write

concurrency: daily-key

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make today's key
        env:
          DISCORD_KEY_WEBHOOK: ${{ secrets.DISCORD_KEY_WEBHOOK }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          python3 .github/daily_key.py
